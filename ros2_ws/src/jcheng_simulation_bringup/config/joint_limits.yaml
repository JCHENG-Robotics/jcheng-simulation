# Joint limits used by the simulation plant, the mock backend and the URDF.
#
# Position limits are the vendor servo EEPROM bounds minus the 20-pulse margin
# adopted in the frozen jcheng-manipulation baseline
# (ros2_ws/src/armpi_ultra_description/urdf/armpi_ultra.xacro, 2026-11-18). The
# velocity value is a SIMULATION command cap, not a measured servo limit; the
# vendor URDF's effort="1000" and velocity="10" are placeholders.
#
# l_joint is a mimic (-1 x r_joint) and is not a command joint in v0.1.
schema_version: 1
joints:
  joint1:
    lower: -1.8012
    upper: 1.8012
    velocity: 1.5
  joint2:
    lower: -0.6618
    upper: 1.1519
    velocity: 1.5
  joint3:
    lower: -1.8012
    upper: 0.0
    velocity: 1.5
  joint4:
    lower: -1.5917
    upper: 1.5917
    velocity: 1.5
  joint5:
    lower: -1.5917
    upper: 1.5499
    velocity: 1.5
  r_joint:
    lower: -2.22
    upper: 0.0
    velocity: 1.5
