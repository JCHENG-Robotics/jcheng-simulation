# Simulation configuration for the v0.1 plant.
#
# Every run is confined to ROS_DOMAIN_ID / domain 43. The launch file rejects
# any other value; config/domains.yaml is intentionally not used because the
# plant never joins the vendor (0), privileged (41) or capability (42) domains.
schema_version: 1
domain_id: 43
truth:
  label: simulated
  topic: /sim/truth/source
backends:
  mock:
    rate_hz: 50
    scan_rate_hz: 10
    beam_count: 360
    max_range_m: 8.0
    joint_time_constant_s: 0.08
    command_timeout_ms: 500
    initial:
      r_joint: -0.4
    room:
      width_m: 4.0
      depth_m: 3.0
      obstacle_x_m: 0.8
      obstacle_y_m: 0.0
      obstacle_radius_m: 0.15
  gz:
    world: worlds/jcheng_lab.sdf
    model_name: jcheng_armpi_sim
    headless: true
topics:
  joint_command: /sim/joint_command
  joint_states: /sim/joint_states
  scan: /sim/scan
  camera_image: /sim/camera/image
  camera_info: /sim/camera/camera_info
