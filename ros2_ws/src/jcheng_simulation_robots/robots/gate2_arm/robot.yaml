# Gate-2 2-DoF arm — migrated from the frozen jcheng-manipulation baseline.
#
# Provenance and every adaptation: docs/MIGRATION-2026-11-26-baseline-arm.md.
# The two controller profiles carry a gz_ros2_control position gain; the
# package test asserts that the two YAML files differ in that byte only.
schema: jcheng.simulation_robot.v1
id: gate2_arm
version: "0.1.0"
description: >
  Primitive 2-DoF arm migrated from the frozen baseline. It exists to exercise
  ros2_control wiring, strict controller-config selection and the fail-closed
  staged startup, not to model any ArmPi geometry.

model:
  name: jcheng_sim_arm
  urdf: urdf/simple_arm.xacro
  controller_arg: controller_config
  spawn: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

joints:
  - {name: joint1, type: revolute, lower: -3.14159, upper: 3.14159, velocity: 3.0, effort: 100.0}
  - {name: joint2, type: revolute, lower: -3.14159, upper: 3.14159, velocity: 3.0, effort: 50.0}

controllers:
  manager: /sim/controller_manager
  update_rate: 100
  config: config/arm_controllers.yaml
  gain_node: /sim/gz_ros_control
  startup_order: [joint_state_broadcaster, arm_controller]
  startup_timeout_s: 60.0
  profiles:
    gain_0p1: {file: config/arm_controllers_gain_0p1.yaml, gain: 0.1}
    gain_0p2: {file: config/arm_controllers_gain_0p2.yaml, gain: 0.2}
  items:
    - name: joint_state_broadcaster
      kind: broadcaster
      type: joint_state_broadcaster/JointStateBroadcaster
    - name: arm_controller
      kind: trajectory
      type: joint_trajectory_controller/JointTrajectoryController
      joints: [joint1, joint2]
      command_interfaces: [position]
      state_interfaces: [position, velocity]

sensors: []

world: worlds/arm_lab.sdf

mock:
  rate_hz: 50
  time_constant_s: 0.08
  command_timeout_ms: 500
  initial: {}

topics:
  joint_command: /sim/joint_command
  joint_states: /sim/joint_states

truth:
  topic: /sim/truth/source
  label: simulated
