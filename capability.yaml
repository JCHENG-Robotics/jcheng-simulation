# Capability manifest for the organization's admission check.
#
# jcheng-simulation is an OFFLINE simulation plant, not a domain-42 motion
# capability. It stands in for the vendor hardware world on domain 43 and is
# never part of the runtime motion graph.
#
# Two fields intentionally deviate from capability-manifest.v1 (jcheng-interfaces
# v0.1.0):
#   * runtime.ros_domains is [43], not the schema's const [42];
#   * safety.requires_lease is false, because an offline plant never consumes a
#     control lease.
# tests/test_contract.py asserts both deviations explicitly. The schema revision
# is tracked as M3 in ROADMAP.md; do not silently "fix" these values.
schema_version: 1
name: jcheng-simulation
version: 0.1.0
contract:
  interfaces: ">=0.1,<0.2"
  contract_hash: "sha256:0b8d72ced7f54d444d6851d8b99a51a78e2bed3f687324f51a15f76557f24b42"
  system_api: ">=0.1,<0.2"
safety:
  class: offline
  scopes: []
  requires_lease: false
  max_rate_hz: 50
  deadman_ms: 500
hardware_access: none
runtime:
  ros_domains: [43]
  publishes:
    - /sim/joint_states
    - /sim/scan
    - /sim/camera/image
    - /sim/camera/camera_info
    - /sim/truth/source
  subscribes:
    - /sim/joint_command
    - /clock
