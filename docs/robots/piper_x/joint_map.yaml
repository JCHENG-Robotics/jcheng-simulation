safety_notes:
  - "URDF effort=100 and velocity=5 are declarations, not measured limits; do not use them as a safety envelope."
  - "The public Piper X specification lists J6 +/-165 deg (2.880 rad); the MIT URDF and pyAgxArm's ROBOT_JOINT_LIMIT_PRESET_RAD['piper_x'] both list +/-170 deg (2.967 rad). Until firmware and a bus read confirm the limit, prefer the conservative 2.880 rad in a soft limit."
  - "The URDF root is `world` through a fixed `world_to_base_link`; a plant that expects base_link at the origin must flatten or re-root it explicitly."
  - "This table describes the 6-revolute + master-gripper model. It is not the 8-joint model in piper_isaac_sim and must not be mixed with it."
