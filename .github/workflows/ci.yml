name: simulation-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: contract + boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - name: Install test dependencies
        shell: bash
        run: |
          python3 -m pip install --no-cache-dir 'pytest==8.3.4' 'PyYAML==6.0.2'
      - name: Unit and boundary tests
        shell: bash
        run: python3 -m pytest -q tests
      - name: Repository gate (static parts)
        shell: bash
        run: bash scripts/check_repo_gate.sh

  ros-build:
    name: ros build + mock smoke (jazzy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ros:jazzy-ros-base
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build and simulation dependencies
        shell: bash
        run: |
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-yaml \
            ros-jazzy-xacro \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-ros-gz \
            ros-jazzy-gz-ros2-control \
            ros-jazzy-joint-state-broadcaster \
            ros-jazzy-joint-trajectory-controller
      - name: Build package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --base-paths ros2_ws/src \
            --packages-select jcheng_simulation_bringup \
            --event-handlers console_cohesion+
      - name: Expand the URDF
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          xacro ros2_ws/src/jcheng_simulation_bringup/urdf/jcheng_armpi_sim.urdf.xacro \
            controllers_yaml:="$PWD/ros2_ws/src/jcheng_simulation_bringup/config/controllers.yaml" \
            > /tmp/jcheng_armpi_sim.urdf
          test -s /tmp/jcheng_armpi_sim.urdf
      - name: Validate robot and world SDF
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          gz sdf -p /tmp/jcheng_armpi_sim.urdf > /tmp/jcheng_armpi_sim.sdf
          gz sdf -p ros2_ws/src/jcheng_simulation_bringup/worlds/jcheng_lab.sdf \
            > /tmp/jcheng_lab.sdf
          test -s /tmp/jcheng_armpi_sim.sdf
          test -s /tmp/jcheng_lab.sdf
      - name: Launch description
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 launch jcheng_simulation_bringup sim.launch.py --show-args
      - name: Mock backend smoke
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export ROS_DOMAIN_ID=43
          ros2 launch jcheng_simulation_bringup sim.launch.py backend:=mock \
            > /tmp/mock.log 2>&1 &
          PID=$!
          ready=0
          for i in $(seq 1 30); do
            if ros2 topic list 2>/dev/null | grep -qx '/sim/joint_states'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/mock.log
            kill -TERM "$PID" 2>/dev/null || true
            exit 1
          fi
          timeout 10 ros2 topic echo /sim/truth/source --once | grep -q simulated
          timeout 10 ros2 topic echo /sim/scan --once | grep -q 'frame_id: laser_link'
          kill -TERM "$PID" 2>/dev/null || true
          pkill -TERM -P "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

  simulation-gate:
    name: simulation-gate
    runs-on: ubuntu-latest
    needs: [contract, ros-build]
    steps:
      - name: Gate
        run: echo "contract, boundary, ROS build and mock smoke passed"
